name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o heavy_fleet_maintenance_flutter.zip -d app
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        working-directory: app/heavy_fleet_maintenance
        run: flutter create .

      - name: Install dependencies
        working-directory: app/heavy_fleet_maintenance
        run: flutter pub get

      - name: Build APK
        working-directory: app/heavy_fleet_maintenance
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: heavy-fleet-maintenance-apk
          path: app/heavy_fleet_maintenance/build/app/outputs/flutter-apk/app-release.apk
